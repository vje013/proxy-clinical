# Classic single-patient narrative: full name + subject ID up front, then
# generic / title / initials references across five paragraphs.
id: narr-skel-01
kind: narrative
patients: 1
tags: [single, classic]
paragraphs:
  - - {bank: intro_single}
    - {bank: study_context, optional: 0.85}
    - {bank: history, forms: {patient: generic_patient}}
    - {bank: demographics_extra, forms: {patient: any}, optional: 0.75}
  - - {bank: dosing, forms: {patient: title_last}}
    - {bank: exposure, forms: {patient: any}, optional: 0.85}
    - {bank: onset, forms: {patient: generic_subject}}
    - {bank: event_detail, forms: {patient: any}, optional: 0.9}
  - - {bank: severity_action, forms: {patient: any}}
    - {bank: hospitalization, forms: {patient: any}, optional: 0.5}
    - {bank: labs, forms: {patient: any}, optional: 0.9}
    - {bank: conmeds_detail, forms: {patient: any}, optional: 0.75}
    - {bank: course, forms: {patient: initials}}
  - - {bank: reporting, optional: 0.85}
    - {bank: outcome, forms: {patient: any}}
    - {bank: causality, forms: {investigator: last}}
    - {bank: dechallenge, forms: {patient: any}, optional: 0.75}
  - - {bank: followup, forms: {patient: any}, optional: 0.9}
    - {bank: closing, forms: {patient: any}}
    - {bank: sponsor_comment, optional: 0.65}
    - {bank: contact, optional: 0.06}
