# Fallback base: Llama-3.2-3B-Instruct (gated on the Hub; needs HF_TOKEN with access).
#   python -m lora.train --config configs/pilot-llama.yaml --resume-if-exists
name: pilot-llama-3.2-3b

model:
  name_or_path: meta-llama/Llama-3.2-3B-Instruct
  revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95   # HF commit, resolved 2026-09-18
  torch_dtype: bfloat16
  attn_implementation: sdpa

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  train: data/pilot/train.jsonl
  val: data/pilot/val.jsonl
  corpus: data/pilot/corpus.jsonl
  instruction_version: v1

train:
  output_dir: runs/pilot-llama-3.2-3b
  seed: 1234
  learning_rate: 2.0e-4
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  max_length: 6144
  lr_scheduler_type: cosine
  warmup_steps: 10
  weight_decay: 0.0
  logging_steps: 5
  eval_strategy: steps
  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  gradient_checkpointing: true
  bf16: true
  fp16: false

infer:
  max_new_tokens: 4096
  batch_size: 8
  dtype: bfloat16
  deterministic_algorithms: true
