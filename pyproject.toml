[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthgen"
version = "0.1.0"
description = "Proxy Clinical synthetic de-identification corpus generator (Block 1)"
requires-python = ">=3.11"
dependencies = [
    "Faker>=20",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
paraphrase = ["anthropic>=0.30"]

[project.scripts]
synthgen = "synthgen.cli:main"

[tool.setuptools.packages.find]
include = ["synthgen*"]

[tool.setuptools.package-data]
synthgen = ["vocab/*.txt", "vocab/*.tsv", "templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
