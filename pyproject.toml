[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthgen"
version = "0.1.0"
description = "Proxy Clinical: synthetic de-id corpus generator (Block 1) and LoRA tagger training/eval (Block 2)"
requires-python = ">=3.11"
dependencies = [
    "Faker>=20",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
paraphrase = ["anthropic>=0.30"]
# Block 2. Exact pins live in requirements-colab.txt; these are the floors.
train = ["torch>=2.14", "transformers>=5.17", "peft>=0.21", "trl>=1.13", "datasets>=5.0", "accelerate>=1.15"]

[project.scripts]
synthgen = "synthgen.cli:main"

[tool.setuptools.packages.find]
include = ["synthgen*", "lora*"]

[tool.setuptools.package-data]
synthgen = ["vocab/*.txt", "vocab/*.tsv", "templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end CPU smoke runs (about a minute)"]
